<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASPN FBS Football</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Light tokens first; the dark set (the ASPN look) follows the viewer's setting */
  :root{
    --ink:#EEF0F3; --panel:#FFFFFF; --panel2:#F6F7F9; --line:rgba(16,20,28,.10); --line-soft:rgba(16,20,28,.06);
    --text:#15181E; --muted:#535B68; --faint:#646B78; --blurb:#2A2F38; --hover:rgba(16,20,28,.035); --stick-hover:#F7F8FA;
    --bar:rgba(238,240,243,.94); --warn-text:#7A5208; --logo-bg:#5B6270; --track:rgba(16,20,28,.08);
    --good:#1E7A4C; --mid:#9A6608; --poor:#B5372F;
    --brand-blue:#0A84C6; --brand-blue-deep:#0A84C6;
    --brand-green:#1FA30A; --brand-green-deep:#1FA30A; --marker:#39FF14;
    --team:#0A84C6;
    --turf:#17301F; --turf-line:rgba(255,255,255,.16);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#121011; --panel:#1B1817; --panel2:#232020; --line:rgba(255,255,255,.08); --line-soft:rgba(255,255,255,.05);
      --text:#F4F1ED; --muted:#A39C93; --faint:#958E86; --blurb:#DCD6CE; --hover:rgba(255,255,255,.03); --stick-hover:#201d1c;
      --bar:rgba(18,16,17,.94); --warn-text:#F1D9A8; --logo-bg:#3a3534; --track:rgba(255,255,255,.08);
      --good:#49B87D; --mid:#E0A83E; --poor:#DA5B54;
      --brand-blue:#8FD3FF; --brand-blue-deep:#1FC3FF;
      --brand-green:#39FF14; --brand-green-deep:#1FA30A; --team:#1FC3FF;
    }
  }
  :root[data-theme="dark"]{
    --ink:#121011; --panel:#1B1817; --panel2:#232020; --line:rgba(255,255,255,.08); --line-soft:rgba(255,255,255,.05);
    --text:#F4F1ED; --muted:#A39C93; --faint:#958E86; --blurb:#DCD6CE; --hover:rgba(255,255,255,.03); --stick-hover:#201d1c;
    --bar:rgba(18,16,17,.94); --warn-text:#F1D9A8; --logo-bg:#3a3534; --track:rgba(255,255,255,.08);
    --good:#49B87D; --mid:#E0A83E; --poor:#DA5B54;
    --brand-blue:#8FD3FF; --brand-blue-deep:#1FC3FF;
    --brand-green:#39FF14; --brand-green-deep:#1FA30A; --team:#1FC3FF;
  }
  :root{box-sizing:border-box; padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px);}
  *{box-sizing:border-box; min-width:0;}
  html{scroll-padding-top:env(safe-area-inset-top, 0px);}
  html,body{margin:0; max-width:100%; overflow-x:clip;}   /* clip, not hidden: hidden turns body into a scroller and breaks sticky */
  body{background:var(--ink); color:var(--text); font-family:'Work Sans', system-ui, sans-serif; -webkit-font-smoothing:antialiased; min-height:100%;}
  img, svg{max-width:100%; height:auto;}
  .num{font-variant-numeric:tabular-nums; font-family:'IBM Plex Mono','Work Sans',monospace;}
  a{color:inherit;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--brand-blue); outline-offset:2px;}
  table{border-collapse:collapse; width:100%;}
  .tbl-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:10px; background:var(--panel);}
  .tbl-scroll table{min-width:max-content;}
  .tbl-scroll td.stick, .tbl-scroll th.stick{position:sticky; left:0; background:var(--panel); z-index:1;}
  th{font-weight:600; font-size:11px; color:var(--faint); text-align:right; padding:9px 10px; white-space:nowrap; border-bottom:1px solid var(--line); vertical-align:bottom;}
  th.l, td.l{text-align:left;}
  th .sort{all:unset; cursor:pointer; color:inherit;}
  th .sort:hover, th .sort.on{color:var(--text);}
  th .sort:focus-visible{outline:2px solid var(--brand-blue); outline-offset:2px;}
  th .grp{display:block; font-size:10px; color:var(--faint); font-weight:500;}
  td{padding:8px 10px; font-size:13px; border-top:1px solid var(--line-soft); white-space:nowrap; text-align:right;}
  tr.click{cursor:pointer;}
  tr.click:hover td{background:var(--hover);}
  tr.click:hover td.stick{background:var(--stick-hover);}

  .topnav{position:sticky; top:env(safe-area-inset-top, 0px); z-index:20; background:var(--bar); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:12px 20px;}
  .topnav-inner{max-width:1400px; margin:0 auto; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:10px; flex-shrink:0; text-decoration:none;}
  .brand-logo{display:block; height:30px; width:auto;}
  .brand-sub{font-size:11px; color:var(--muted); font-weight:600; border-left:1px solid var(--line); padding-left:9px; line-height:1.25;}
  .search-wrap{position:relative; flex:1 1 200px; max-width:380px;}
  .search-input{width:100%; background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:9px 13px; font-size:14px; outline:none;}
  .search-input:focus{border-color:var(--brand-blue);}
  .search-results{position:absolute; top:calc(100% + 6px); left:0; right:0; max-height:360px; overflow-y:auto; background:var(--panel2); border:1px solid var(--line);
                  border-radius:10px; box-shadow:0 20px 50px rgba(0,0,0,.5); display:none; z-index:30;}
  .search-results.open{display:block;}
  .result-row{width:100%; text-align:left; background:none; border:none; color:var(--text); padding:9px 13px; display:flex; align-items:center; gap:10px; cursor:pointer; border-bottom:1px solid var(--line); font-size:13.5px;}
  .result-row:hover, .result-row.hl{background:rgba(255,255,255,.05);}
  .result-row .meta{margin-left:auto; color:var(--faint); font-size:12px;}
  .stamp{margin-left:auto; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:7px;}
  .stamp .dot{width:7px; height:7px; border-radius:50%; background:var(--good);}
  .stamp.warn .dot{background:var(--mid);}

  .shell{max-width:1400px; margin:0 auto; padding:18px 20px 80px;}
  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px; overflow-x:auto;}
  .tab{all:unset; cursor:pointer; padding:10px 14px; font-size:14px; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; white-space:nowrap;}
  .tab:hover{color:var(--text);}
  .tab.on{color:var(--text); border-bottom-color:var(--brand-blue-deep);}
  .tab:focus-visible{outline:2px solid var(--brand-blue); outline-offset:-2px;}
  .warnbox{border:1px solid rgba(224,168,62,.4); background:rgba(224,168,62,.08); color:var(--warn-text); border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:16px;}

  h1{font-size:24px; font-weight:700; margin:0 0 4px; letter-spacing:-.01em;}
  h2{font-size:17px; font-weight:700; margin:28px 0 10px;}
  .lede{color:var(--muted); font-size:14px; line-height:1.55; max-width:70ch; margin:0 0 16px;}
  .note{color:var(--faint); font-size:12px; line-height:1.5; margin:8px 0 0; max-width:90ch;}

  .controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px;}
  select, .seg button, .btn{background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:8px 11px; font-size:13px;}
  select:focus{border-color:var(--brand-blue); outline:none;}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .seg button{border:none; border-radius:0; cursor:pointer; color:var(--muted); background:var(--panel);}
  .seg button.on{background:rgba(31,195,255,.16); color:var(--text);}
  .btn{cursor:pointer;}
  .btn:hover{border-color:var(--brand-blue);}

  .logo{width:22px; height:22px; border-radius:50%; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
        font-family:'Playfair Display',serif; font-weight:800; font-size:10px; color:#fff; vertical-align:middle;}
  .logo img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:var(--panel2);}
  .tname{display:inline-flex; align-items:center; gap:8px;}
  .tname b{font-weight:600;}
  .tname .sub{color:var(--faint); font-size:11.5px;}
  .rk{color:var(--faint); font-size:11px;}
  .linky{all:unset; cursor:pointer;}
  .linky:hover b{text-decoration:underline; text-underline-offset:3px;}
  .linky:focus-visible{outline:2px solid var(--brand-blue); outline-offset:2px; border-radius:4px;}
  .pos{color:var(--good);} .neg{color:var(--poor);}
  .up{color:var(--good); font-size:11px;} .down{color:var(--poor); font-size:11px;}
  .dim{color:var(--faint);}

  .team-head{display:flex; align-items:center; gap:16px; padding:16px 0 14px; border-bottom:3px solid var(--team); margin-bottom:16px; flex-wrap:wrap;}
  .team-head .logo{width:64px; height:64px; font-size:22px;}
  .team-head .rankbig{font-family:'Playfair Display',serif; font-weight:800; font-size:44px; line-height:1; color:var(--team); margin-left:auto; text-align:right;}
  .team-head .rankbig small{display:block; font-family:'Work Sans',sans-serif; font-size:11px; color:var(--muted); font-weight:600;}
  .back{all:unset; cursor:pointer; font-size:13px; color:var(--muted);}
  .back:hover{color:var(--text);}
  .kpis{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .kpi{background:var(--panel); padding:12px 14px;}
  .kpi .k{font-size:12px; color:var(--muted);}
  .kpi .v{font-size:22px; font-weight:600; margin-top:3px;}
  .kpi .r{font-size:12px; color:var(--faint); margin-top:2px;}
  .blurb{font-size:14.5px; line-height:1.6; color:var(--blurb); max-width:75ch; margin:14px 0 0;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media (max-width:900px){ .grid2{grid-template-columns:1fr;} }

  .day-h{font-size:13px; font-weight:700; color:var(--muted); margin:18px 0 8px;}
  .gm{display:grid; grid-template-columns:84px minmax(180px,1.6fr) 110px 140px 120px 130px; gap:12px; align-items:center; padding:10px 14px; background:var(--panel);
      border:1px solid var(--line); border-radius:10px; margin-bottom:6px; font-size:13px;}
  .gm .time{color:var(--faint); font-size:12px;}
  .gm .teams{display:flex; flex-direction:column; gap:5px;}
  .gm .teams .row{display:flex; align-items:center; gap:8px;}
  .gm .teams .row .score{margin-left:auto; font-weight:600; color:var(--muted);}
  .gm .at{color:var(--faint); font-size:11px; width:16px; text-align:center; flex-shrink:0;}
  .gm .lbl{font-size:11px; color:var(--faint);}
  .gm .val{font-weight:600;}
  .wpbar{height:6px; border-radius:3px; background:var(--track); overflow:hidden; margin-top:5px;}
  .wpbar i{display:block; height:100%; background:var(--brand-blue-deep);}
  .edge{font-size:12.5px; font-weight:600;}
  @media (max-width:900px){ .gm{grid-template-columns:1fr 1fr; row-gap:10px;} .gm .time, .gm .teams{grid-column:1 / -1;} }

  /* the matchup field: the one loud element */
  .mu{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px;}
  .mu-pick{display:grid; grid-template-columns:1fr 200px 1fr; gap:10px; align-items:end;}
  .mu-pick label{font-size:12px; color:var(--muted); display:block; margin-bottom:5px;}
  .mu-pick select{width:100%;}
  .field{margin-top:30px; position:relative; height:110px; border-radius:8px; overflow:visible; background:var(--turf);}
  .field .yl{position:absolute; top:0; bottom:0; width:1px; background:var(--turf-line);}
  .field .yn{position:absolute; bottom:6px; transform:translateX(-50%); font-family:'IBM Plex Mono',monospace; font-size:11px; color:rgba(255,255,255,.45);}
  .field .ez{position:absolute; top:0; bottom:0; width:9.0909%; display:flex; align-items:center; justify-content:center; font-family:'Playfair Display',serif;
             font-weight:800; font-size:13px; color:#fff; text-align:center; padding:4px; text-shadow:0 1px 3px rgba(0,0,0,.6); overflow:hidden;}
  .field .ez.l{left:0; border-radius:8px 0 0 8px;} .field .ez.r{right:0; border-radius:0 8px 8px 0;}
  .field .ball{position:absolute; top:32px; width:3px; height:58px; margin-left:-1px; background:var(--marker); box-shadow:0 0 14px var(--marker); transition:left .6s cubic-bezier(.2,.8,.2,1);}
  .field .ball span{position:absolute; top:-26px; left:50%; transform:translateX(-50%); white-space:nowrap; font-size:13px; font-weight:700; color:var(--marker);}
  .field .mid{position:absolute; top:0; bottom:0; left:50%; width:2px; margin-left:-1px; background:rgba(255,255,255,.4);}
  @media (prefers-reduced-motion:reduce){ .field .ball{transition:none;} }
  .mu-out{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-top:16px;}
  .mu-out .k{font-size:12px; color:var(--muted);}
  .mu-out .v{font-size:20px; font-weight:600; margin-top:3px;}

  /* game comparison */
  .cmp-head{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:14px; padding:16px 0 14px; margin-bottom:6px;
            border-bottom:3px solid; border-image:linear-gradient(to right, var(--ca) 0 50%, var(--ch) 50% 100%) 1;}
  .cmp-head .ch-team{display:flex; align-items:center; gap:12px;}
  .cmp-head .ch-team:last-child{flex-direction:row-reverse; text-align:right;}
  .cmp-head .logo{width:52px; height:52px; font-size:18px;}
  .ch-name{font-family:'Playfair Display',serif; font-weight:800; font-size:26px; line-height:1.1;}
  .ch-meta{font-size:12.5px; color:var(--muted); margin-top:3px;}
  .ch-at{text-align:center; color:var(--faint); font-size:13px;}
  .ch-at small{display:block; margin-top:4px; font-size:11px;}
  .edge-list{margin:0 0 14px; padding-left:18px; font-size:14px; line-height:1.6; color:var(--blurb); max-width:80ch;}
  .edge-block{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:4px 12px 8px;}
  .eb-h{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; padding:10px 0 8px; border-bottom:1px solid var(--line);}
  .eb-h span{display:inline-flex; align-items:center; gap:6px;} .eb-h .eb-vs{color:var(--faint); font-size:11px;}
  .eb-h .logo{width:22px; height:22px; font-size:9px;}
  .edge-row{display:grid; grid-template-columns:minmax(120px,1.2fr) 92px minmax(90px,1fr) 92px; grid-template-areas:"h vo s vd" "h tag tag tag";
            column-gap:10px; row-gap:2px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line-soft);}
  .edge-row:last-child{border-bottom:none;}
  .rawtag{font-style:normal; font-size:10px; font-weight:500; margin-left:6px; padding:0 5px; border:1px solid var(--line); border-radius:8px; color:var(--faint); vertical-align:1px;}
  .er-h{grid-area:h; font-size:13px; font-weight:600;} .er-h span{display:block; font-size:11px; color:var(--faint); font-weight:400;}
  .er-v{grid-area:vo; font-size:12px; text-align:right;} .er-v.r{grid-area:vd; text-align:left;}
  .er-tag{grid-area:tag; font-size:11px; text-align:center;}
  .strip{grid-area:s; position:relative; height:16px; background:var(--turf); border-radius:4px; overflow:hidden;}
  .strip .cap{position:absolute; top:0; bottom:0; width:6%;} .strip .cap.l{left:0;} .strip .cap.r{right:0;}
  .strip .mid{position:absolute; top:0; bottom:0; left:50%; width:1px; background:var(--turf-line);}
  .strip .spot{position:absolute; top:2px; bottom:2px; width:3px; margin-left:-1px; background:var(--marker); box-shadow:0 0 8px var(--marker);}
  .tape td{white-space:nowrap;} .tape td.mid-l, .tape th.mid-l{text-align:center; color:var(--muted); font-size:12px; white-space:normal;}
  .tape td.better{font-weight:700; color:var(--text);} .tape td.better::after{content:""; }
  .tape td:first-child.better{box-shadow:inset -3px 0 0 var(--ca, var(--brand-blue));}
  .tape td:last-child.better{box-shadow:inset 3px 0 0 var(--ch, var(--brand-blue));}
  .tape .tape-rk{font-size:11px; font-weight:400;}
  .tape tr.sec td{text-align:center; font-size:11px; color:var(--faint); font-weight:600; background:var(--panel2); padding:6px;}
  .tape table{min-width:0;} .tape td:first-child, .tape td:last-child{width:38%;}
  .sub-h{font-size:14px; font-weight:600; margin:0 0 8px; display:flex; align-items:center; gap:8px;}
  .sub-h .logo{width:20px; height:20px; font-size:8px;}
  .lead-tbl{margin-bottom:10px;}
  .sec-head{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:28px 0 10px;} .sec-head h2{margin:0;}
  .cmp-go{font-size:12px; color:var(--brand-blue);}
  .gm .cmp-link{grid-column:1 / -1; justify-self:start; font-size:12px; color:var(--brand-blue); background:none; border:none; padding:0; cursor:pointer;}
  .gm .cmp-link:hover{text-decoration:underline;}
  .gm.click{cursor:pointer;} .gm.click:hover{border-color:var(--brand-blue);}
  @media (max-width:640px){
    .cmp-head{grid-template-columns:1fr; text-align:left;}
    .cmp-head .ch-team:last-child{flex-direction:row; text-align:left;}
    .ch-at{text-align:left;}
    .ch-name{font-size:21px;}
    .edge-row{grid-template-columns:72px 1fr 72px; grid-template-areas:"h h h" "vo s vd" "tag tag tag";}
  }

  .calib svg{display:block; width:100%; max-width:420px;}
  .wrap table{min-width:0;} .wrap td{white-space:normal;}
  .statline{display:flex; flex-wrap:wrap; gap:28px; margin:6px 0 4px;}
  .statline .v{font-size:26px; font-weight:600;}
  .statline .k{font-size:12px; color:var(--muted); margin-top:2px; max-width:24ch; line-height:1.4;}

  @media (max-width:640px){
    .topnav{padding:10px 12px;}
    .shell{padding:14px 12px 60px;}
    .stamp{display:none;}
    .search-wrap{flex-basis:100%; max-width:none;}
    .team-head .rankbig{font-size:34px;}
    .mu-pick{grid-template-columns:1fr;}
    .field .ez{font-size:10px;}
  }

  /* c3.3 layout fixes */
  .tbl-scroll.tall{max-height:calc(100dvh - 150px);}
  @media (min-width:1025px){
    .tbl-scroll.tall{overflow:auto;}
    .tbl-scroll.tall thead th{position:sticky; top:0; z-index:2; background:var(--panel);}
    .tbl-scroll.tall thead th.stick{z-index:3; left:0;}
  }
  @media (min-width:1680px){ .shell,.topnav-inner{max-width:1840px;} }
  @media (pointer:coarse){
    .tab,.seg button,select,.btn{min-height:44px;}
    th .sort{display:block; padding:14px 6px; margin:-9px -6px;}
  }
  @media (max-width:640px){
    .tabs{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent); mask-image:linear-gradient(90deg,#000 88%,transparent);}
    .tbl-scroll td.stick .tname .sub{display:none;}
    .tbl-scroll.tall th:first-child, .tbl-scroll.tall td:first-child{display:none;}
    .topnav{position:static;}
    .tabs{position:sticky; top:env(safe-area-inset-top,0px); z-index:15; background:var(--ink);}
    .tbl-scroll.tall{max-height:none;}
  }
  /* c3.4: weeks, results and game recaps */
  .wk-nav{display:flex; align-items:center; gap:6px; margin:4px 0 6px;}
  .wk-step{all:unset; cursor:pointer; flex-shrink:0; width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:8px; background:var(--panel); font-size:18px; color:var(--text);}
  .wk-step:hover{border-color:var(--brand-blue);} .wk-step[disabled]{opacity:.35; cursor:default;}
  .wk-step:focus-visible{outline:2px solid var(--brand-blue); outline-offset:2px;}
  .wk-strip{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; padding:2px;} .wk-strip::-webkit-scrollbar{display:none;}
  .wk{all:unset; cursor:pointer; flex-shrink:0; min-width:22px; text-align:center; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:var(--panel);
      font-family:'IBM Plex Mono','Work Sans',monospace; font-size:13px; color:var(--text);}
  .wk.done{color:var(--muted); background:var(--panel2);}
  .wk:hover{border-color:var(--brand-blue);}
  .wk.on{background:rgba(31,195,255,.16); border-color:var(--brand-blue-deep); color:var(--text); font-weight:600;}
  .wk:focus-visible{outline:2px solid var(--brand-blue); outline-offset:1px;}
  .wk-sum{font-size:13.5px; color:var(--muted); margin:6px 0 12px; max-width:90ch;}
  .gm .time span{display:block; margin-top:2px;}
  .gm.final .row .score{color:var(--text); font-weight:700;}
  .gm.final .row.lost .score{color:var(--faint); font-weight:500;}

<script>
const DATA = __CFB_DATA__;
</script>
<script>
(function(){
"use strict";
const arr = x => Array.isArray(x) ? x : [];   // R writes an empty table as {}
["teams","logs","leaders","slate","graded","conferences","sim","players","career","defense"].forEach(k => { DATA[k] = arr(DATA[k]); });
const M = DATA.meta, TEAMS = DATA.teams;
const byId = new Map(TEAMS.map(t => [t.id, t]));
const MT = DATA.matchup || {teams: []};
const SIM = new Map(DATA.sim.map(r => [r.id, r]));
const PLAYERS = DATA.players, PM = DATA.player_meta || {};
const mtIndex = new Map((MT.teams || []).map((t, i) => [t.id, i]));
const view = document.getElementById("view");
// a logo that can't load (offline, blocked) is removed so the initials show
document.addEventListener("error", e => { const el = e.target; if (el && el.tagName === "IMG" && el.closest(".logo")) el.remove(); }, true);

// ---------------------------------------------------------- helpers
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fin = x => typeof x === "number" && isFinite(x);
const f = (x, d = 1) => fin(x) ? x.toFixed(d) : "–";
const sgn = (x, d = 1) => fin(x) ? (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(d) : "–";
const pct = (x, d = 1) => fin(x) ? (x * 100).toFixed(d) + "%" : "–";
const pctInt = x => fin(x) ? Math.round(x * 100) + "%" : "–";
const ord = n => { if (!fin(n)) return "–"; const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const nameOf = id => (byId.get(id) || {}).name || ((MT.teams || [])[mtIndex.get(id)] || {}).name || "Unknown";
const short = id => (byId.get(id) || {}).abbr || nameOf(id);
const isFbs = id => byId.has(id);
// a line is always "favorite −points"; m is the margin for the side named by favId
const line = (favId, pts) => !fin(pts) ? "–" : Math.abs(pts) < 0.05 ? "Pick'em" : `${short(favId)} −${Math.abs(pts).toFixed(1)}`;
const homeLine = (g, hm) => !fin(hm) ? "–" : line(hm >= 0 ? g.home_id : g.away_id, hm);   // hm = home margin
const mktLine = g => !fin(g.mkt_spread) ? "–" : line(g.mkt_spread <= 0 ? g.home_id : g.away_id, g.mkt_spread);
const parseKick = s => { if (!s) return null; const d = new Date(/Z$|[+-]\d\d:?\d\d$/.test(s) ? s : s + "Z"); return isNaN(d) ? null : d; };
function initials(n){ const w = String(n).replace(/[^A-Za-z ]/g, "").split(" ").filter(Boolean); return (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || "?").slice(0, 2)).toUpperCase(); }
const teamColor = id => { const t = byId.get(id); return t && t.color ? "#" + String(t.color).replace("#", "") : null; };
function logo(id, size){
  const sz = size ? `width:${size}px;height:${size}px;` : "";
  return `<span class="logo" style="${sz}background:${teamColor(id) || "var(--logo-bg)"}" aria-hidden="true">${esc(initials(nameOf(id)))}` +
    `<img src="https://a.espncdn.com/i/teamlogos/ncaa/500/${id}.png" alt="" loading="lazy"></span>`;
}
function teamLink(id, opts = {}){
  const t = byId.get(id);
  if (!t) return `<span class="tname">${logo(id)}<b>${esc(nameOf(id))}</b><span class="sub">FCS</span></span>`;
  const rk = opts.rank === false ? "" : `<span class="rk num">${t.rank}</span>`;
  return `<button class="linky" data-team="${id}"><span class="tname">${logo(id)}${rk}<b>${esc(t.name)}</b>${opts.sub ? `<span class="sub">${esc(opts.sub)}</span>` : ""}</span></button>`;
}
// percentile shading against the values shown; hi = bigger is better
function shadeFrom(p){ if (p == null) return ""; const d = p - .5, a = Math.min(.32, Math.abs(d) * .64);
  return a < .04 ? "" : `background:${d > 0 ? `rgba(73,184,125,${a.toFixed(3)})` : `rgba(218,91,84,${a.toFixed(3)})`}`; }
function shade(vals, hi){
  const v = vals.filter(fin).slice().sort((a, b) => a - b), n = v.length;
  return x => {
    if (!fin(x) || n < 4) return "";
    let lo = 0, up = n; while (lo < up){ const m = (lo + up) >> 1; if (v[m] < x) lo = m + 1; else up = m; }
    const p = lo / (n - 1); return shadeFrom(hi ? p : 1 - p);
  };
}
const rankCache = {};
function natRank(key, id, hi){
  const ck = key + (hi ? "+" : "-");
  if (!rankCache[ck]){
    const arr = TEAMS.filter(t => fin(t[key])).map(t => [t.id, t[key]]).sort((a, b) => hi ? b[1] - a[1] : a[1] - b[1]);
    rankCache[ck] = new Map(arr.map((r, i) => [r[0], i + 1]));
  }
  return rankCache[ck].get(id);
}
function wire(root){
  root.querySelectorAll("[data-team]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); go("team/" + el.dataset.team); }));
  root.querySelectorAll("tr[data-row-team]").forEach(el => el.addEventListener("click", () => go("team/" + el.dataset.rowTeam)));
  root.querySelectorAll("[data-game]").forEach(el => {
    el.addEventListener("click", e => { e.stopPropagation(); go("game/" + el.dataset.game); });
    if (el.tagName !== "BUTTON") el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); go("game/" + el.dataset.game); } });
  });
}
function go(h){ if (location.hash.slice(1) === h) route(); else location.hash = h; }

// ---------------------------------------------------------- traditional stats
// Box-score numbers built from every play (garbage time included), next to the
// advanced numbers. statMode is shared by the team pages and the Players tab.
const TR = DATA.trad || {};
const GAMES = new Map(arr(DATA.graded).map(g => [g.game_id, g]));
// ---------------------------------------------------------- games, weeks and recaps (c3.4)
// Every completed game has a recap (#game/<id>); every upcoming one a matchup
// screen. gteam is each team's box per game, gbox every player's line per game.
const RECAPS = DATA.recaps && !Array.isArray(DATA.recaps) ? DATA.recaps : {};
const RMETA = DATA.recap_meta || {};
const PN = DATA.pnames && !Array.isArray(DATA.pnames) ? DATA.pnames : {};
function unpack(t){ if (!t || !t.cols) return []; const c = t.cols; return arr(t.rows).map(r => { const o = {}; c.forEach((k, i) => { o[k] = r[i]; }); return o; }); }
const GTEAM = new Map();
unpack(DATA.gteam).forEach(r => { if (!GTEAM.has(r.game_id)) GTEAM.set(r.game_id, {}); GTEAM.get(r.game_id)[r.team] = r; });
const GB = DATA.gbox || {}, GB_GAME = new Map(), GB_PLAYER = new Map();
["pass", "rush", "rec", "def", "kick"].forEach(role => unpack(GB[role]).forEach(r => {
  r.role = role;
  if (!GB_GAME.has(r.game_id)) GB_GAME.set(r.game_id, []);
  GB_GAME.get(r.game_id).push(r);
  if (r.id != null){ if (!GB_PLAYER.has(r.id)) GB_PLAYER.set(r.id, []); GB_PLAYER.get(r.id).push(r); }
}));
const pName = r => r.name || (PN[r.id] || [])[0] || "Name not in the data";
const pPos = r => (PN[r.id] || [])[1] || "";
const wkKey = g => g.season_type === "postseason" ? "post" : String(g.week);
const wkLabel = k => k === "post" ? "Bowls" : `Week ${k}`;
const wkNum = k => k === "post" ? 999 : +k;
const SLATE_IDS = new Set(arr(DATA.slate).map(g => g.game_id));
const UPCOMING = [...arr(DATA.slate), ...arr(DATA.schedule).filter(g => !SLATE_IDS.has(g.game_id))].filter(g => !GAMES.has(g.game_id));
const upcomingFor = (h, a) => UPCOMING.find(g => g.home_id === h && g.away_id === a);
const WEEKS = [...new Set([...arr(DATA.graded), ...UPCOMING].filter(g => g.week != null || g.season_type === "postseason").map(wkKey))].sort((a, b) => wkNum(a) - wkNum(b));
function defaultWeek(){
  const up = arr(DATA.slate).map(wkKey).sort((a, b) => wkNum(a) - wkNum(b))[0];
  if (up) return up;
  const gr = arr(DATA.graded).map(wkKey).sort((a, b) => wkNum(a) - wkNum(b));
  return gr.length ? gr[gr.length - 1] : WEEKS[0];
}
const dayOf = s => { if (!s) return null; const d = new Date(String(s).slice(0, 10) + "T12:00:00"); return isNaN(d) ? null : d; };
const dayShort = s => { const d = dayOf(s); return d ? d.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"}) : ""; };
// a completed game's result from one team's side, linked to the recap
function resultBtn(gid, pf, pa){
  const won = pf > pa, txt = `${won ? "W" : "L"} ${pf}–${pa}`;
  return GAMES.has(gid) ? `<button class="linky res" data-game="${gid}" title="Game recap"><b class="${won ? "pos" : "neg"}">${txt}</b></button>`
                        : `<span class="${won ? "pos" : "neg"}">${txt}</span>`;
}
// record through a date, from the team's game log
function recordThrough(id, date){
  const ls = arr(DATA.logs).filter(x => x.id === id && String(x.date) <= String(date));
  if (!ls.length) return null;
  const w = ls.filter(x => x.pf > x.pa).length;
  return `${w}–${ls.length - w}`;
}
// who covered the closing line (g.spread is the home team's line)
function coverOf(g){
  if (!fin(g.spread)) return null;
  const x = g.home_pts - g.away_pts + g.spread;
  return Math.abs(x) < 1e-9 ? {push: true} : {team: x > 0 ? g.home_id : g.away_id};
}
const sideColors = (A, H) => {
  let ca = teamColor(A) || "#3D7EA6", ch = teamColor(H) || "#A6573D";
  if (ca.toLowerCase() === ch.toLowerCase()) ca = "#8A9099";
  return {ca, ch};
};
// a small win probability line: away team's half on top, home's below
function sparkline(g, w = 124, h = 30){
  const rc = RECAPS[g.game_id];
  if (!rc || !rc.wp || !arr(rc.wp.t).length) return "";
  const T = rc.wp.t, V = rc.wp.w, tEnd = Math.max(3600, T[T.length - 1]), {ca, ch} = sideColors(g.away_id, g.home_id);
  const X = t => (t / tEnd * w).toFixed(1), Y = v => (2 + v / 1000 * (h - 4)).toFixed(1), mid = Y(500);
  const ln = "M" + T.map((t, i) => `${X(t)},${Y(V[i])}`).join("L"), id = "sp" + g.game_id;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">
    <defs><linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="2" x2="0" y2="${h - 2}"><stop offset=".5" stop-color="${ca}"/><stop offset=".5" stop-color="${ch}"/></linearGradient></defs>
    <path d="${ln}L${X(T[T.length - 1])},${mid}L${X(T[0])},${mid}Z" fill="url(#${id})" fill-opacity=".9"/>
    <line x1="0" x2="${w}" y1="${mid}" y2="${mid}" stroke="var(--faint)" stroke-width=".6" stroke-dasharray="2 2"/></svg>`;
}
let statMode = "adv";
TEAMS.forEach(t => { t.ppg = t.gp ? t.pf / t.gp : null; t.papg = t.gp ? t.pa / t.gp : null; });
const mmss = x => fin(x) ? `${Math.floor(x)}:${String(Math.round((x % 1) * 60)).padStart(2, "0")}` : "–";
const int0 = x => fin(x) ? Math.round(x).toLocaleString() : "–";
const tradOf = (role, id) => arr(TR[role]).find(p => p.id === id);
const hasPlayer = id => PLAYERS.some(p => p.id === id) || ["pass", "rush", "rec", "def", "kick"].some(r => tradOf(r, id));
function modeSeg(){
  return `<div class="seg" role="group" aria-label="Stat type">
    <button data-mode="adv" class="${statMode === "adv" ? "on" : ""}" aria-pressed="${statMode === "adv"}">Advanced</button>
    <button data-mode="trad" class="${statMode === "trad" ? "on" : ""}" aria-pressed="${statMode === "trad"}">Traditional</button></div>`;
}
function wireMode(root, redraw){
  root.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => { statMode = b.dataset.mode; redraw(); }));
}
function wirePlayers(root){
  root.querySelectorAll("[data-player]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); go("player/" + el.dataset.player); }));
}
const playerName = p => p.id != null && hasPlayer(p.id)
  ? `<button class="linky" data-player="${p.id}"><b>${esc(p.name)}</b></button>` : `<b>${esc(p.name)}</b>`;

// ---------------------------------------------------------- chrome
(function chrome(){
  const st = document.getElementById("stamp");
  const through = M.data_through ? new Date(M.data_through + "T12:00:00").toLocaleDateString(undefined, {month:"short", day:"numeric"}) : null;
  st.lastElementChild.textContent = through ? `${M.season} season, games through ${through}` : `${M.season} preseason`;
  st.title = `Built ${M.built}`;
  if ((M.warnings || []).length){
    st.classList.add("warn");
    document.getElementById("warn").innerHTML = M.warnings.map(w => `<div class="warnbox">${esc(w)}</div>`).join("");
  }
  const s = document.getElementById("search"), res = document.getElementById("results");
  let hits = [], hl = 0;
  function render(){
    res.innerHTML = hits.map((t, i) => `<button class="result-row${i === hl ? " hl" : ""}" data-id="${t.id}" role="option">${logo(t.id)}<span>${esc(t.name)}</span><span class="meta">${ord(t.rank)}, ${esc(t.conf)}</span></button>`).join("");
    res.classList.toggle("open", hits.length > 0);
    res.querySelectorAll(".result-row").forEach(b => b.addEventListener("mousedown", e => { e.preventDefault(); pick(+b.dataset.id); }));
  }
  function pick(id){ s.value = ""; hits = []; render(); s.blur(); go("team/" + id); }
  s.addEventListener("input", () => {
    const q = s.value.trim().toLowerCase();
    hits = q ? TEAMS.filter(t => t.name.toLowerCase().includes(q) || (t.abbr || "").toLowerCase() === q).slice(0, 10) : [];
    hl = 0; render();
  });
  s.addEventListener("keydown", e => {
    if (e.key === "ArrowDown"){ hl = Math.min(hl + 1, hits.length - 1); render(); e.preventDefault(); }
    else if (e.key === "ArrowUp"){ hl = Math.max(hl - 1, 0); render(); e.preventDefault(); }
    else if (e.key === "Enter" && hits[hl]) pick(hits[hl].id);
    else if (e.key === "Escape"){ hits = []; render(); }
  });
  s.addEventListener("blur", () => setTimeout(() => { hits = []; render(); }, 120));
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));

function renderRankings(){
  const confs = [...new Set(TEAMS.map(t => t.conf))].sort();
  const cols0 = RK_COLS[rkState.view];
  const cols = (COMPACT.matches && rkState.view === "ratings") ? cols0.filter(c => ["wl","net","off","def"].includes(c.k)) : cols0;
  const sc = cols.find(c => c.k === rkState.sort) || cols[1];
  const sv = sc.sortv || (t => t[sc.k]);
  const rows = TEAMS.filter(t => !rkState.conf || t.conf === rkState.conf).slice().sort((a, b) => {
    const x = sv(a), y = sv(b);
    if (!fin(x) && !fin(y)) return a.rank - b.rank; if (!fin(x)) return 1; if (!fin(y)) return -1;
    return (x - y) * rkState.dir || a.rank - b.rank;
  });
  const sh = {}; cols.forEach(c => { if (!c.noshade) sh[c.k] = shade(rows.map(t => t[c.k]), c.hi); });
  const head = `<tr><th class="l">Rk</th><th class="l stick">Team</th>${cols.map(c =>
    `<th title="${esc(c.tip || "")}"><button class="sort${rkState.sort === c.k ? " on" : ""}" data-k="${c.k}">${c.g ? `<span class="grp">${esc(c.g)}</span>` : ""}${esc(c.h)}${rkState.sort === c.k ? (rkState.dir < 0 ? " ↓" : " ↑") : ""}</button></th>`).join("")}</tr>`;

    `<td class="num" style="${sh[c.k] ? sh[c.k](t[c.k]) : ""}">${c.fmt(t)}</td>`).join("")}</tr>`).join("");
  const top = TEAMS[0];
  view.innerHTML = `
    <h1>FBS power ratings</h1>
    <p class="lede">Teams ranked by Net rating: how many points better than an average FBS team they'd be on a neutral field, adjusted for opponents and home field.${top ? ` ${esc(top.name)} leads at ${sgn(top.net)}.` : ""}${(M.week || 0) <= 4 ? " This early, the preseason projection still carries much of the weight." : ""}</p>
    <div class="controls">
      <div class="seg" role="group" aria-label="Columns">
        <button data-v="ratings" class="${rkState.view === "ratings" ? "on" : ""}" aria-pressed="${rkState.view === "ratings"}">Ratings</button>
        <button data-v="factors" class="${rkState.view === "factors" ? "on" : ""}" aria-pressed="${rkState.view === "factors"}">Five factors</button>
        <button data-v="trad_o" class="${rkState.view === "trad_o" ? "on" : ""}" aria-pressed="${rkState.view === "trad_o"}">Offense stats</button>
        <button data-v="trad_d" class="${rkState.view === "trad_d" ? "on" : ""}" aria-pressed="${rkState.view === "trad_d"}">Defense stats</button>
      </div>
      <select id="rkConf" aria-label="Conference"><option value="">All conferences</option>${confs.map(c => `<option${c === rkState.conf ? " selected" : ""}>${esc(c)}</option>`).join("")}</select>
    </div>
    <div class="tbl-scroll tall"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <p class="note">${rkState.view === "factors" ? "Five factors are season-to-date raw numbers with garbage time removed, not adjusted for opponents. " : rkState.view.startsWith("trad") ? "Box-score numbers, season to date, counted from every play (garbage time included) and not adjusted for opponents. Defense columns are what opponents gained against this team. " : "Adjusted success rate and EPA/play are opponent- and home-field-adjusted, with garbage time removed. "}Shading compares the teams shown, so filtering to a conference re-shades within it. Rk follows the current sort. Click a column header to sort.</p>`;
  view.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    rkState.view = b.dataset.v; rkState.sort = RK_DEFAULT[rkState.view];
    rkState.dir = (RK_COLS[rkState.view].find(c => c.k === rkState.sort) || {}).hi === false ? 1 : -1; renderRankings();
  }));
  view.querySelector("#rkConf").addEventListener("change", e => { rkState.conf = e.target.value; renderRankings(); });
  view.querySelectorAll("th .sort").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.k, c = cols.find(x => x.k === k);
    if (rkState.sort === k) rkState.dir *= -1; else { rkState.sort = k; rkState.dir = c.hi ? -1 : 1; }
    renderRankings();
  }));
  wire(view);
}

function blurb(t){
  const n = TEAMS.length, r = (k, hi) => natRank(k, t.id, hi);
  const ro = r("off", true), rd = r("def", false);
  const desc = x => x <= 10 ? "an elite" : x <= 30 ? "a very good" : x <= 60 ? "an above-average" : x <= 90 ? "a below-average" : "a struggling";
  const parts = [`${t.name} ranks ${ord(t.rank)} of ${n} in Net rating (${sgn(t.net)}), with ${desc(ro)} offense (${ord(ro)}) and ${desc(rd)} defense (${ord(rd)}).`];
  const mv = t.pre_rank - t.rank;
  if (Math.abs(mv) >= 10) parts.push(`That's ${Math.abs(mv)} spots ${mv > 0 ? "higher" : "lower"} than the preseason projection had them.`);
  if (fin(t.luck) && Math.abs(t.luck) >= 0.75) parts.push(`They've won ${Math.abs(t.luck).toFixed(1)} ${t.luck > 0 ? "more" : "fewer"} games than the model expected before kickoff.`);
  const rs = r("sr_o", true), rx = r("iso_o", true);
  if (rs && rx && rs <= 25 && rx > 70) parts.push("The offense wins by staying ahead of the chains more than by hitting big plays.");
  else if (rs && rx && rx <= 25 && rs > 70) parts.push("The offense leans on big plays more than consistency.");
  const rh = r("havoc_d", true); if (rh && rh <= 15) parts.push(`The defense creates havoc on ${pct(t.havoc_d)} of snaps (${ord(rh)}).`);
  return parts.join(" ");
}

function outlook(t){
  const sm = SIM.get(t.id), parts = [];
  if (sm) parts.push(`<h2>Season outlook</h2><div class="kpis">
      <div class="kpi"><div class="k">Projected record</div><div class="v num">${f(sm.w)}–${f(sm.l)}</div><div class="r">${f(sm.cw)}–${f(sm.cl)} in conference</div></div>
      <div class="kpi"><div class="k">Wins conference</div><div class="v num">${pctInt(sm.p_conf)}</div><div class="r">${pctInt(sm.p_ccg)} reach the title game</div></div>
      <div class="kpi"><div class="k">Makes the playoff</div><div class="v num">${pctInt(sm.p_cfp)}</div><div class="r">${pctInt(sm.p_bye)} with a bye</div></div>
      <div class="kpi"><div class="k">Wins it all</div><div class="v num">${sm.p_title >= 0.995 ? ">99%" : sm.p_title > 0 && sm.p_title < 0.005 ? "<1%" : pctInt(sm.p_title)}</div><div class="r">${pctInt(sm.p_sf)} reach the semifinals</div></div>
    </div>`);
  const rows = [];
  if (t.qb_name || fin(t.qb_proj)) rows.push(`<tr><td class="l">Starting QB${t.qb_name ? `: ${esc(t.qb_name)}` : ""}</td><td class="num">${t.qb_new ? "No meaningful FBS snaps" : sgn(t.qb_proj, 3)}</td><td class="l dim">projected EPA/dropback above average</td></tr>`);
  if (fin(t.qb_delta)) rows.push(`<tr><td class="l">QB change from last season</td><td class="num ${t.qb_delta > 0.01 ? "pos" : t.qb_delta < -0.01 ? "neg" : ""}">${sgn(t.qb_delta, 3)}</td><td class="l dim">projected, vs. last season's starter</td></tr>`);
  if (fin(t.skill_delta)) rows.push(`<tr><td class="l">Backs and receivers, change</td><td class="num ${t.skill_delta > 0.2 ? "pos" : t.skill_delta < -0.2 ? "neg" : ""}">${sgn(t.skill_delta, 2)}</td><td class="l dim">projected EPA per game vs. last season's group</td></tr>`);
  if (fin(t.run_block)) rows.push(`<tr><td class="l">Run game around the ball carrier</td><td class="num">${sgn(t.run_block, 3)}</td><td class="l dim">${ord(natRank("run_block", t.id, true))}; EPA/rush from blocking and scheme</td></tr>`);
  if (rows.length) parts.push(`<h2>Roster</h2><div class="tbl-scroll"><table><tbody>${rows.join("")}</tbody></table></div>
    <p class="note">The QB and skill-player lines feed the preseason projection. Starter: the team's dropback leader in its first two games (before the season, a named starter or the best projection on the roster).</p>`);
  return parts.join("");
}

function playerTrad(id){
  const roleLbl = {pass:"Passing", rush:"Rushing", rec:"Receiving", def:"Defense", kick:"Kicking"};
  const lines = Object.keys(TP_COLS).map(r => [r, tradOf(r, id)]).filter(x => x[1]);
  if (!lines.length) return "";
  const season = lines.map(([r, p]) => `<div class="tbl-scroll lead-tbl"><table><thead><tr><th class="l">${roleLbl[r]}</th>${TP_COLS[r].map(c => `<th>${esc(c.h)}</th>`).join("")}</tr></thead>
    <tbody><tr><td class="l">${M.season}</td>${TP_COLS[r].map(c => `<td class="num">${c.fmt ? c.fmt(p) : (fin(p[c.k]) ? p[c.k] : "–")}</td>`).join("")}</tr></tbody></table></div>`).join("");
  // game log: one row per game, the roles he had that day side by side
  const LOGC = {pass:[["C/A", r => `${r.cmp}/${r.att}`], ["Yds", r => r.yds], ["TD", r => r.td], ["INT", r => r.int]],
                rush:[["Car", r => r.att], ["Yds", r => r.yds], ["TD", r => r.td]],
                rec:[["Rec", r => r.rec], ["Yds", r => r.yds], ["TD", r => r.td]],
                def:[["Sk", r => r.sack], ["INT", r => r.int], ["PBU", r => r.pbu || "–"], ["FF", r => r.ff || "–"]]};
  // c3.4: every game he has a line in, from the per-game box scores
  const byGame = new Map(), used = new Set();
  (GB_PLAYER.get(id) || []).filter(r => LOGC[r.role]).forEach(r => {
    used.add(r.role);
    if (!byGame.has(r.game_id)) byGame.set(r.game_id, {team: r.team, epa: null});
    const v = byGame.get(r.game_id); v[r.role] = r;
    if (fin(r.epa)) v.epa = (v.epa || 0) + r.epa;
  });
  const roles = Object.keys(LOGC).filter(r => used.has(r)), anyEpa = [...byGame.values()].some(v => fin(v.epa));
  let logHtml = "";
  if (byGame.size){
    const rows = [...byGame.entries()].map(([gid, v]) => ({gid, v, g: GAMES.get(gid)})).filter(x => x.g).sort((a, b) => String(a.g.date).localeCompare(String(b.g.date)));
    logHtml = `<h2>Game log</h2><div class="tbl-scroll"><table><thead><tr><th>Wk</th><th class="l">Opponent</th><th>Result</th>${roles.map(r => LOGC[r].map((c, i) =>
      `<th>${i === 0 ? `<span class="grp">${roleLbl[r]}</span>` : `<span class="grp">&nbsp;</span>`}${c[0]}</th>`).join("")).join("")}${anyEpa ? `<th title="Expected points added on his passes, runs and catches"><span class="grp">&nbsp;</span>EPA</th>` : ""}</tr></thead><tbody>${rows.map(({gid, v, g}) => {
      const home = g.home_id === v.team, opp = home ? g.away_id : g.home_id, pf = home ? g.home_pts : g.away_pts, pa = home ? g.away_pts : g.home_pts;
      return `<tr><td class="num">${g.season_type === "postseason" ? "Bowl" : g.week}</td><td class="l"><span class="dim">${g.neutral ? "vs (N)" : home ? "vs" : "at"}</span> ${teamLink(opp)}</td>
        <td class="num">${resultBtn(gid, pf, pa)}</td>${roles.map(r => LOGC[r].map(c => `<td class="num">${v[r] ? c[1](v[r]) : ""}</td>`).join("")).join("")}${anyEpa ? `<td class="num">${fin(v.epa) ? sgn(v.epa, 1) : ""}</td>` : ""}</tr>`;
    }).join("")}</tbody></table></div><p class="note">Click a result for the game recap. EPA counts every play he was credited with, garbage time included.</p>`;
  }
  return `<h2>Box-score stats</h2>${season}${logHtml}`;
}

const pjState = {conf:"", sort:"p_cfp", dir:-1};

    {k:"w", h:"W–L", g:"Projected", fmt:r => `${f(r.w)}–${f(r.l)}`, sort:r => r.w},
    {k:"cw", h:"Conf", g:"Projected", fmt:r => r.cw + r.cl > 0 ? `${f(r.cw)}–${f(r.cl)}` : "–", sort:r => r.cw},
    {k:"p_bowl", h:"6+ wins", fmt:r => pr(r.p_bowl)},
    {k:"p_ccg", h:"Title game", g:"Conference", fmt:r => pr(r.p_ccg)},
    {k:"p_conf", h:"Champion", g:"Conference", fmt:r => pr(r.p_conf)},

    {k:"p_bye", h:"Bye", g:"Playoff", fmt:r => pr(r.p_bye)},
    {k:"p_sf", h:"Semis", g:"Playoff", fmt:r => pr(r.p_sf)},
    {k:"p_final", h:"Final", g:"Playoff", fmt:r => pr(r.p_final)},
    {k:"p_title", h:"Champion", g:"Playoff", fmt:r => pr(r.p_title)}];
  let rows = DATA.sim.map(r => Object.assign({}, r, {t: byId.get(r.id)})).filter(r => r.t && (!pjState.conf || r.t.conf === pjState.conf));
  const c = cols.find(x => x.k === pjState.sort) || cols[5], sv = c.sort || (r => r[c.k]);
  rows.sort((a, b) => (sv(a) - sv(b)) * pjState.dir || a.t.rank - b.t.rank);
  const heat = x => fin(x) && x >= 0.005 ? `background:rgba(73,184,125,${(0.06 + 0.4 * x).toFixed(3)})` : "";

  view.innerHTML = `<h1>Season projections</h1>
    <p class="lede">The rest of the season played out ${sm.n.toLocaleString()} times: ${sm.games_left} regular-season games, every conference title game and the 12-team playoff. Each run draws every team's true strength from its rating and how sure the model is of it, so upsets compound the way they do in a real season.</p>
    <h2>Most likely playoff field</h2>
    <div class="tbl-scroll"><table><thead><tr><th class="l">Avg seed</th><th class="l stick">Team</th><th>Makes it</th><th>Bye</th><th>Wins it all</th></tr></thead><tbody>
    ${field.map(r => `<tr><td class="l num">${f(r.seed)}</td><td class="l stick">${teamLink(r.id)}</td><td class="num">${pr(r.p_cfp)}</td><td class="num">${pr(r.p_bye)}</td><td class="num">${pr(r.p_title)}</td></tr>`).join("")}</tbody></table></div>
    <p class="note">The 12 teams that make it most often, ordered by their average seed when they do.</p>
    <h2>Every team</h2>
    <div class="controls"><select id="pjConf" aria-label="Conference"><option value="">All conferences</option>${confs.map(x => `<option${x === pjState.conf ? " selected" : ""}>${esc(x)}</option>`).join("")}</select></div>
    <div class="tbl-scroll"><table><thead><tr><th class="l">Rk</th><th class="l stick">Team</th><th>Now</th>${cols.map(cc =>
      `<th><button class="sort${pjState.sort === cc.k ? " on" : ""}" data-k="${cc.k}">${cc.g ? `<span class="grp">${esc(cc.g)}</span>` : ""}${esc(cc.h)}${pjState.sort === cc.k ? (pjState.dir < 0 ? " ↓" : " ↑") : ""}</button></th>`).join("")}</tr></thead>
      <tbody>${rows.map(r => `<tr class="click" data-row-team="${r.id}"><td class="l num dim">${r.t.rank}</td><td class="l stick">${teamLink(r.id, {rank:false, sub:r.t.conf})}</td><td class="num">${r.t.w}–${r.t.l}</td>${cols.map(cc =>

  view.querySelector("#pjConf").addEventListener("change", e => { pjState.conf = e.target.value; renderProjections(); });

function renderGames(){
  if (gmState.week == null || !WEEKS.includes(gmState.week)) gmState.week = defaultWeek();
  const k = gmState.week, wi = WEEKS.indexOf(k), prev = WEEKS[wi - 1], next = WEEKS[wi + 1];
  const all = k == null ? [] : weekGames(k);
  const confs = [...new Set(TEAMS.map(t => t.conf))].sort();
  const rk = id => (byId.get(id) || {rank: 999}).rank;
  const confOf = id => (byId.get(id) || {}).conf;
  const gap = g => g.final ? (fin(g.spread) && fin(g.pm) ? g.pm + g.spread : null) : (fin(g.mkt_spread) && fin(g.pm) ? g.pm + g.mkt_spread : null);
  const gs = all.filter(g => {
    if (gmState.conf && confOf(g.home_id) !== gmState.conf && confOf(g.away_id) !== gmState.conf) return false;
    if (gmState.filter === "top25" && !(rk(g.home_id) <= 25 || rk(g.away_id) <= 25)) return false;
    if (gmState.filter === "fbs" && !(isFbs(g.home_id) && isFbs(g.away_id))) return false;
    if (gmState.filter === "edge" && !(fin(gap(g)) && Math.abs(gap(g)) >= 3)) return false;
    return true;
  });
  const when = g => g.final ? String(g.date) + "T00" : String(g.kickoff);
  const best = (a, b) => (rk(a.home_id) + rk(a.away_id)) - (rk(b.home_id) + rk(b.away_id));
  const closeV = g => g.final ? Math.abs(g.home_pts - g.away_pts) : Math.abs(g.pm);
  const drama = g => g.final && RECAPS[g.game_id] && fin(RECAPS[g.game_id].exc) ? RECAPS[g.game_id].exc : -1;
  const sorters = {
    time: (a, b) => when(a).localeCompare(when(b)) || best(a, b),
    best, close: (a, b) => closeV(a) - closeV(b) || best(a, b),
    edge: (a, b) => (fin(gap(b)) ? Math.abs(gap(b)) : -1) - (fin(gap(a)) ? Math.abs(gap(a)) : -1),
    drama: (a, b) => drama(b) - drama(a) || best(a, b)
  };
  gs.sort(sorters[gmState.sort] || sorters.time);
  const card = g => g.final ? finalCard(g) : upcomingCard(g);
  const days = new Map();
  gs.forEach(g => { const d = g.final ? dayOf(g.date) : parseKick(g.kickoff);
    const key = d ? d.toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"}) : "Date to be announced";
    if (!days.has(key)) days.set(key, []); days.get(key).push(g); });
  const nFinal = all.filter(g => g.final).length, nUp = all.length - nFinal;
  const tally = arr => {
    const su = arr.filter(g => fin(g.pm)), right = su.filter(g => (g.pm > 0) === (g.home_pts > g.away_pts)).length;
    const at = arr.filter(g => fin(g.spread) && fin(g.pm) && g.home_pts - g.away_pts + g.spread !== 0 && g.pm + g.spread !== 0);
    const atsR = at.filter(g => (g.pm + g.spread > 0) === (g.home_pts - g.away_pts + g.spread > 0)).length;
    return {n: su.length, right, atsN: at.length, atsR};
  };
  const wt = tally(all.filter(g => g.final)), gr = arr(DATA.graded), allT = tally(gr), savedN = gr.filter(g => g.saved).length;
  const sumBits = [];
  if (nFinal) sumBits.push(`${nFinal} final`);
  if (nUp) sumBits.push(`${nUp} to play`);
  const sumLine = `${esc(wkLabel(k || ""))}: ${sumBits.join(", ") || "no games"}.${wt.n ? ` The model went ${wt.right}–${wt.n - wt.right} picking winners and ${wt.atsR}–${wt.atsN - wt.atsR} against the line.` : ""}`;
  const listHtml = !WEEKS.length ? `<p class="note">No games in this build's schedule. The matchup predictor below still works.</p>`

// ---------------------------------------------------------- matchup tool
const muState = {a:null, b:null, loc:"neutral"};
function normCdf(z){ const t = 1 / (1 + .2316419 * Math.abs(z)), d = .3989423 * Math.exp(-z * z / 2);
  const p = d * t * (.3193815 + t * (-.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; }
// Each team's rating is shipped in points (FBS games and games with an FCS
// team), already weighted for this point in the season; the page adds home
// field, travel and the gap, and builds the total from the component ratings.
function milesBetween(a1, o1, a2, o2){
  const r = Math.PI / 180, a = Math.sin((a2 - a1) * r / 2) ** 2 + Math.cos(a1 * r) * Math.cos(a2 * r) * Math.sin((o2 - o1) * r / 2) ** 2;
  return 3958.8 * 2 * Math.asin(Math.min(1, Math.sqrt(a)));
}
function predict(homeId, awayId, neutral){
  const hi = mtIndex.get(homeId), ai = mtIndex.get(awayId);
  if (hi == null || ai == null || !MT.net) return null;
  const T = MT.teams || [], fbsGame = !!(T[hi] && T[hi].fbs && T[ai] && T[ai].fbs);
  const N = fbsGame ? MT.net : (MT.net_fcs || MT.net);
  let trav = 0;
  if (!neutral && MT.margin.trav && MT.lat && fin(MT.lat[hi]) && fin(MT.lat[ai]))
    trav = Math.log1p(milesBetween(MT.lat[ai], MT.lon[ai], MT.lat[hi], MT.lon[hi]));
  const hF = !!(T[hi] && T[hi].fbs), aF = !!(T[ai] && T[ai].fbs), qd = MT.qb_dq || [];
  const lvl = hF && !aF ? 1 : (!hF && aF ? -1 : 0);                       // FBS-vs-FCS level, as in the R layer
  const qbd = fbsGame ? (MT.margin.qbd || 0) * ((qd[hi] || 0) - (qd[ai] || 0)) : 0;   // expected-starter gap
  const pm = MT.margin.loc * (neutral ? 0 : 1) + (MT.margin.trav || 0) * trav + (N[hi] - N[ai]) + (MT.margin.lvl || 0) * lvl + qbd;
  const tot = C => C ? 2 * C.mu + C.O[hi] + C.D[ai] + C.O[ai] + C.D[hi] : 0;
  const t = MT.total, tE = tot(MT.E), tP = tot(MT.P), tN = tot(MT.N);
  const pt = (t.int || 0) + (t.tP || 0) * tP + (t.tE || 0) * tE + (t.tN || 0) * tN + (t.tEN || 0) * tE * tN / 100;
  let sig = (M.week || 0) < 4 ? MT.sigma.early : MT.sigma.mid;
  if (!fbsGame && fin(MT.sigma.fcs)) sig = MT.sigma.fcs;                  // games with an FCS team miss by more
  return {pm, pt, p: normCdf(pm / sig)};
}
function renderMatchup(el){
  const list = (MT.teams || []).slice().sort((x, y) => (y.fbs - x.fbs) || x.name.localeCompare(y.name));
  if (muState.a == null && TEAMS.length > 1){ muState.a = TEAMS[0].id; muState.b = TEAMS[1].id; }
  const opts = sel => list.map(t => `<option value="${t.id}"${t.id === sel ? " selected" : ""}>${esc(t.name)}${t.fbs ? "" : " (FCS)"}</option>`).join("");
  el.innerHTML = `
    <div class="mu-pick">
      <div><label for="muA">Team</label><select id="muA">${opts(muState.a)}</select></div>
      <div><label for="muLoc">Where</label><select id="muLoc">
        <option value="neutral"${muState.loc === "neutral" ? " selected" : ""}>Neutral site</option>
        <option value="a"${muState.loc === "a" ? " selected" : ""}>At the first team</option>
        <option value="b"${muState.loc === "b" ? " selected" : ""}>At the second team</option></select></div>
      <div><label for="muB">Opponent</label><select id="muB">${opts(muState.b)}</select></div>
    </div>
    <div class="field" id="field" aria-hidden="true"></div>
    <div class="mu-out" id="muOut" aria-live="polite"></div>
    <button class="btn" id="muCmp" style="margin-top:14px">Compare these teams</button>`;
  const draw = () => {
    const a = muState.a, b = muState.b, homeIsA = muState.loc !== "b";
    const r = predict(homeIsA ? a : b, homeIsA ? b : a, muState.loc === "neutral");
    const out = el.querySelector("#muOut"), fld = el.querySelector("#field");
    if (!r || a === b){ out.innerHTML = `<p class="note">Pick two different teams.</p>`; fld.innerHTML = ""; return; }
    const mA = homeIsA ? r.pm : -r.pm, pA = homeIsA ? r.p : 1 - r.p;
    const sA = Math.round((r.pt + mA) / 2), sB = Math.round((r.pt - mA) / 2), fav = mA >= 0 ? a : b;
    // A defends the left end zone and drives right: the marker sits as many yards past midfield as A's predicted margin
    let lines = "";
    for (let y = 10; y <= 90; y += 10){ const left = 9.0909 + y * 0.818182;
      lines += `<div class="yl" style="left:${left}%"></div><div class="yn" style="left:${left}%">${y <= 50 ? y : 100 - y}</div>`; }
    const x = 50 + Math.max(-49, Math.min(49, mA)) * 0.818182;
    fld.innerHTML = `${lines}<div class="mid"></div>
      <div class="ez l" style="background:${teamColor(a) || "#24506e"}">${esc(short(a))}</div>
      <div class="ez r" style="background:${teamColor(b) || "#5a2e2a"}">${esc(short(b))}</div>
      <div class="ball" style="left:50%"><span>${Math.abs(mA) < 0.05 ? "Even" : esc(short(fav)) + " by " + Math.abs(mA).toFixed(1)}</span></div>`;
    requestAnimationFrame(() => requestAnimationFrame(() => { const bl = fld.querySelector(".ball"); if (bl) bl.style.left = x + "%"; }));
    out.innerHTML = `
      <div><div class="k">Model line</div><div class="v num">${esc(line(fav, mA))}</div></div>
      <div><div class="k">${esc(nameOf(a))} win chance</div><div class="v num">${pctInt(pA)}</div></div>
      <div><div class="k">Projected score</div><div class="v num">${esc(short(a))} ${sA}, ${esc(short(b))} ${sB}</div></div>
      <div><div class="k">Projected total</div><div class="v num">${f(r.pt)}</div></div>`;
  };
  el.querySelector("#muA").addEventListener("change", e => { muState.a = +e.target.value; draw(); });
  el.querySelector("#muB").addEventListener("change", e => { muState.b = +e.target.value; draw(); });
  el.querySelector("#muLoc").addEventListener("change", e => { muState.loc = e.target.value; draw(); });
  el.querySelector("#muCmp").addEventListener("click", () => {
    if (muState.a === muState.b) return;
    const homeIsA = muState.loc !== "b", h = homeIsA ? muState.a : muState.b, a = homeIsA ? muState.b : muState.a;
    go(`compare/${h}/${a}/${muState.loc === "neutral" ? "n" : "h"}`);
  });
  draw();
}

const TAPE = [
  {sec:"Ratings"},
  {h:"Record", v:t => `${t.w}–${t.l}`, noRank:true},

  {h:"Yards per carry", k:"t_ypc_o", fmt:x => f(x, 2)},
  {h:"Rushing yards allowed per game", k:"t_rush_ypg_d", hi:false, fmt:x => f(x)},

  {h:"Third downs allowed", k:"t_d3_pct_d", hi:false, fmt:x => pct(x, 0)},
  {h:"Turnover margin per game", k:"to_margin_pg", fmt:x => sgn(x, 2)},

function stripHtml(off, def, dim){
  // percentile of each side within FBS (1 = best), edge = offense minus defense
  const n = TEAMS.length, to = byId.get(off), td = byId.get(def);
  const ro = to ? natRank(dim.o, off, dim.oHi !== false) : null, rd = td ? natRank(dim.d, def, dim.dHi !== false) : null;
  const vo = to ? to[dim.o] : null, vd = td ? td[dim.d] : null;
  const ok = ro && rd && fin(vo) && fin(vd);
  const e = ok ? (1 - (ro - 1) / (n - 1)) - (1 - (rd - 1) / (n - 1)) : 0;
  const x = 50 + Math.max(-1, Math.min(1, e)) * 44;
  const tag = !ok ? `<span class="dim">Not enough data</span>` : Math.abs(e) < 0.15 ? `<span class="dim">Even</span>`
    : e > 0 ? `<b style="color:${teamColor(off) || "var(--text)"}">${esc(short(off))} offense</b>` : `<b style="color:${teamColor(def) || "var(--text)"}">${esc(short(def))} defense</b>`;
  return {e: ok ? e : null, ro, rd, html: `<div class="edge-row">
    <div class="er-h">${esc(dim.h)}${/^adj_/.test(dim.o) ? "" : `<em class="rawtag">raw</em>`}<span>${esc(dim.sub)}</span></div>
    <div class="er-v num">${ok ? `${dim.fmt(vo)} <span class="dim">${ord(ro)}</span>` : "–"}</div>
    <div class="strip" role="img" aria-label="${esc(dim.h)}: ${ok ? (Math.abs(e) < 0.15 ? "even" : (e > 0 ? short(off) + " offense" : short(def) + " defense") + " has the edge") : "no data"}">
      <i class="cap l" style="background:${teamColor(off) || "#24506e"}"></i><i class="cap r" style="background:${teamColor(def) || "#5a2e2a"}"></i>
      <i class="mid"></i>${ok ? `<i class="spot" style="left:${x.toFixed(1)}%"></i>` : ""}</div>

function fieldHtml(a, b, mA){

    lines += `<div class="yl" style="left:${left}%"></div><div class="yn" style="left:${left}%">${y <= 50 ? y : 100 - y}</div>`; }

function renderCompare(homeId, awayId, neutral){
  const slateG = upcomingFor(homeId, awayId);
  if (slateG) neutral = !!slateG.neutral;
  const pr = slateG && fin(slateG.pm) ? {pm: slateG.pm, pt: slateG.pt, p: slateG.p_home} : predict(homeId, awayId, neutral);
  const A = awayId, H = homeId, tA = byId.get(A), tH = byId.get(H);
  if (!pr || A === H){ view.innerHTML = `<p class="lede">That matchup can't be shown.</p><button class="btn" data-go="games">Back to games</button>`;
    view.querySelector("[data-go]").addEventListener("click", () => go("games")); return; }
  document.documentElement.style.setProperty("--team", teamColor(H) || "var(--brand-blue-deep)");
  const mA = -pr.pm, pA = 1 - pr.p, fav = pr.pm >= 0 ? H : A, pFav = pr.pm >= 0 ? pr.p : 1 - pr.p;
  const sA = Math.round((pr.pt - pr.pm) / 2), sH = Math.round((pr.pt + pr.pm) / 2);
  const side = (id, t) => `<div class="ch-team">${logo(id, 52)}<div><div class="ch-name">${esc(nameOf(id))}</div>
    <div class="ch-meta">${t ? `${ord(t.rank)} in FBS, ${t.w}–${t.l}, ${esc(t.conf)}` : "FCS"}</div></div></div>`;
  const when = slateG ? kickLong(slateG) : neutral ? "Neutral site" : `At ${esc(nameOf(H))}`;
  const gap = slateG && fin(slateG.mkt_spread) ? pr.pm + slateG.mkt_spread : null;
  const kpi = (k, v, r) => `<div class="kpi"><div class="k">${k}</div><div class="v num">${v}</div><div class="r">${r || "&nbsp;"}</div></div>`;

  // edges: each offense against the other defense
  const block = (off, def) => { const rows = CMP_DIMS.map(d => ({d, ...stripHtml(off, def, d)}));
    return {rows, html: `<div class="edge-block"><div class="eb-h"><span>${logo(off, 22)} <b>${esc(nameOf(off))}</b> offense</span><span class="eb-vs">vs</span><span><b>${esc(nameOf(def))}</b> defense ${logo(def, 22)}</span></div>${rows.map(r => r.html).join("")}</div>`}; };
  const bA = block(A, H), bH = block(H, A);
  const edges = [...bA.rows.map(r => ({...r, off: A, def: H})), ...bH.rows.map(r => ({...r, off: H, def: A}))]
    .filter(r => fin(r.e) && Math.abs(r.e) >= 0.3 && r.d.o !== "adj_sr_o").sort((x, y) => Math.abs(y.e) - Math.abs(x.e)).slice(0, 4);
  const edgeText = edges.map(r => r.e > 0
    ? `<li><b>${esc(nameOf(r.off))}</b>'s ${r.d.noun} (${ord(r.ro)} in FBS) against ${esc(nameOf(r.def))}'s ${r.d.dnoun || "defense"} (${ord(r.rd)})</li>`
    : `<li><b>${esc(nameOf(r.def))}</b>'s ${r.d.dnoun || "defense"} (${ord(r.rd)} against ${r.d.noun}) facing ${esc(nameOf(r.off))}'s offense (${ord(r.ro)})</li>`).join("");

  // tale of the tape: same stat for both teams, the better one marked
  const tapeRows = TAPE.map(rw => {
    if (rw.sec) return `<tr class="sec"><td colspan="3">${rw.sec}</td></tr>`;
    const val = t => !t ? null : rw.v ? rw.v(t) : t[rw.k];
    const cmpv = t => !t ? null : rw.cmpv ? rw.cmpv(t) : rw.k ? t[rw.k] : null;
    const ca = cmpv(tA), ch = cmpv(tH), hi = rw.hi !== false;
    const better = rw.noBetter || !fin(ca) || !fin(ch) || ca === ch ? null : ((ca > ch) === hi ? "a" : "h");
    const cellv = (t, id, s) => { const v = val(t); if (v == null || (rw.k && !fin(v))) return `<td class="num${s === "a" ? "" : " l"}">–</td>`;
      const txt = rw.v ? v : rw.fmt(v), r = !rw.noRank && rw.k ? natRank(rw.k, id, hi) : null;
      const rk = r ? `<span class="dim tape-rk">${ord(r)}</span>` : "";
      return `<td class="num${s === "a" ? "" : " l"}${better === s ? " better" : ""}">${s === "a" ? `${rk} ${txt}` : `${txt} ${rk}`}</td>`; };
    return `<tr>${cellv(tA, A, "a")}<td class="mid-l">${rw.h}</td>${cellv(tH, H, "h")}</tr>`;

// the win probability chart: the loud element of the recap

// "what decided it": the factors that separated the teams, biggest first
function decidedBy(g, rc, gt, df){

  const ws = hw ? 1 : 0, ls = 1 - ws, bw = gt[W], bl = gt[L], nW = esc(nameOf(W)), nL = esc(nameOf(L));
  const out = [];
  if (bw && bl && bw.c_pl && bl.c_pl){
    const ew = bw.c_epa / bw.c_pl, el = bl.c_epa / bl.c_pl, sw = bw.c_succ / bw.c_pl, sl = bl.c_succ / bl.c_pl;

      : `<b>${nL}</b> actually moved the ball better, ${sgn(el, 2)} EPA per play to ${sgn(ew, 2)} (success rate ${pct(sl, 0)} to ${pct(sw, 0)}), and lost anyway.`});
  }

    out.push({w: 3 + Math.abs(toW - toL) * 2 + df[tS].pot / 7, html: `<b>${esc(nameOf(T))}</b> won the turnover battle ${Math.min(toW, toL) === toW ? `${toL}–${toW}` : `${toW}–${toL}`}${df[tS].pot ? ` and scored ${df[tS].pot} points off ${esc(nameOf(O))}'s giveaways` : ""}.`});
  } else if (toW > 0) out.push({w: 1, html: `Turnovers were even at ${toW} apiece.`});

    const T = bw.big > bl.big ? W : L, O = T === W ? L : W, a = Math.max(bw.big, bl.big), b = Math.min(bw.big, bl.big);
    out.push({w: 2 + (a - b) * 0.8, html: `Big plays: <b>${esc(nameOf(T))}</b> had ${a} plays of 20 yards or more to ${esc(nameOf(O))}'s ${b}.`});

    const better = fW.tripPts / fW.trips > fL.tripPts / fL.trips ? W : L, a = better === W ? fW : fL, b = better === W ? fL : fW;
    out.push({w: 2 + Math.abs(a.tripPts / a.trips - b.tripPts / b.trips), html: `Finishing drives: <b>${esc(nameOf(better))}</b> scored ${f(a.tripPts / a.trips, 1)} points per trip inside the 40 (${a.trips} trips), ${esc(nameOf(better === W ? L : W))} ${f(b.tripPts / b.trips, 1)} (${b.trips}).`});

    const spot = y => y >= 50 ? `the opponent's ${Math.round(100 - y)}` : `its own ${Math.round(y)}`;
    out.push({w: 1.5 + (a - b) / 5, html: `Field position: <b>${esc(nameOf(better))}</b>'s average drive started at ${spot(a)}, ${esc(nameOf(better === W ? L : W))}'s at ${spot(b)}.`});
  }
  if (bw && bl && bw.d3 >= 5 && bl.d3 >= 5){
    const rw = bw.d3c / bw.d3, rl = bl.d3c / bl.d3;

      out.push({w: 1.5 + Math.abs(rw - rl) * 4, html: `Third downs: <b>${esc(nameOf(T))}</b> converted ${bt.d3c} of ${bt.d3}; ${esc(nameOf(T === W ? L : W))} ${ot.d3c} of ${ot.d3}.`});
    }

  if (bw && bl && Math.abs(bw.sacks - bl.sacks) >= 3){
    const T = bw.sacks < bl.sacks ? W : L;

    const pw = hw ? rc.pg : 1 - rc.pg;
    if (pw < 0.5) out.push({w: 8, html: `By the numbers this was <b>${nL}</b>'s game: on postgame win expectancy, a team that played like ${nL} did wins ${pctInt(1 - pw)} of the time.`});
  }
  if (rc.gt) out.push({w: 0.5, html: `<b>${nW}</b> had it out of reach from the ${perName(rc.gt[1])} quarter${rc.gt[2] ? ` (${rc.gt[2]})` : ""}: everything after that was garbage time, which the efficiency numbers leave out.`});

function topPlayers(lines){
  const m = new Map();
  lines.filter(r => ["pass", "rush", "rec"].includes(r.role) && fin(r.epa)).forEach(r => {
    if (!m.has(r.id)) m.set(r.id, {id: r.id, team: r.team, name: pName(r), pos: pPos(r), epa: 0, bits: []});
    const o = m.get(r.id); o.epa += r.epa;
    if (r.role === "pass") o.bits.push(`${r.cmp}/${r.att}, ${r.yds} yds${r.td ? `, ${r.td} TD` : ""}${r.int ? `, ${r.int} INT` : ""}`);
    if (r.role === "rush" && (r.att >= 3 || Math.abs(r.epa) >= 2)) o.bits.push(`${r.att} car, ${r.yds} yds${r.td ? `, ${r.td} TD` : ""}`);
    if (r.role === "rec" && r.rec) o.bits.push(`${r.rec} rec, ${r.yds} yds${r.td ? `, ${r.td} TD` : ""}`);

}
function renderRecap(gid){

    <h2>Scoring plays</h2>${scHtml}

  if (rc.wp) wpChart(view.querySelector("#wpc"), view.querySelector("#wpread"), rc, g);
  view.querySelectorAll("[data-cmp]").forEach(el => el.addEventListener("click", () => go("compare/" + el.dataset.cmp)));
  wire(view); wirePlayers(view);
}

// ---------------------------------------------------------- conferences
function renderConferences(){
  const cs = DATA.conferences || [];
  const sh = shade(cs.map(c => c.avg_net), true);
  view.innerHTML = `<h1>Conferences</h1>
    <p class="lede">Average Net rating of each conference's FBS members. Independents are grouped together.</p>
    <div class="tbl-scroll"><table><thead><tr><th class="l stick">Conference</th><th>Teams</th><th>Avg Net</th><th>Avg rank</th><th>In top 25</th><th class="l">Best team</th></tr></thead><tbody>
    ${cs.map(c => `<tr><td class="l stick"><button class="linky" data-conf="${esc(c.conf)}"><b>${esc(c.conf)}</b></button></td><td class="num">${c.teams}</td><td class="num" style="${sh(c.avg_net)}">${sgn(c.avg_net)}</td>
      <td class="num">${f(c.avg_rank)}</td><td class="num">${c.top25}</td><td class="l">${teamLink(c.best_id)}</td></tr>`).join("")}</tbody></table></div>
    <p class="note">Click a conference to see its teams in the rankings.</p>`;
  view.querySelectorAll("[data-conf]").forEach(b => b.addEventListener("click", () => { rkState.conf = b.dataset.conf; go("rankings"); }));
  wire(view);
}

// ---------------------------------------------------------- report card
function renderReport(){
  const R = DATA.report || {}, o = R.overall || {}, cur = R.current, lv = R.live || {};
  const seasons = R.by_season || [], phases = R.by_phase || [];
  const phName = {early:"Weeks 1–4", mid:"Week 5 on", cfp:"Playoff", post:"Other bowls"};
  const head = `<tr><th class="l"></th><th>Games</th><th><span class="grp">Winners picked</span>Model</th><th><span class="grp">Winners picked</span>Market</th><th><span class="grp">Margin miss, pts</span>Model</th><th><span class="grp">Margin miss, pts</span>Market</th><th>vs line</th><th>Log loss</th><th><span class="grp">Total miss, pts</span>Model</th><th><span class="grp">Total miss, pts</span>Market</th></tr>`;
  const row = (lab, s) => `<tr><td class="l">${lab}</td><td class="num">${s.games}</td><td class="num">${pct(s.su_model_lined != null ? s.su_model_lined : s.su)}</td><td class="num">${pct(s.su_market)}</td>
    <td class="num">${f(s.mae_model_lined, 2)}</td><td class="num">${f(s.mae_market, 2)}</td><td class="num">${pct(s.ats)}</td><td class="num">${f(s.logloss, 3)}</td><td class="num">${f(s.total_mae, 2)}</td><td class="num">${f(s.total_mae_market, 2)}</td></tr>`;
  const cb = R.calib || [], W = 300, H = 290, pad = 36;
  const sx = v => pad + v * (W - pad - 10), sy = v => H - pad - v * (H - pad - 10);
  const maxN = Math.max(1, ...cb.map(b => b.n));
  const pts = cb.map(b => `<circle cx="${sx(b.pred).toFixed(1)}" cy="${sy(b.actual).toFixed(1)}" r="${(3 + 6 * Math.sqrt(b.n / maxN)).toFixed(1)}" fill="var(--brand-blue-deep)" fill-opacity=".85"><title>Predicted ${pct(b.pred)}, home team won ${pct(b.actual)} of ${b.n}</title></circle>`).join("");
  const ticks = [0, .25, .5, .75, 1].map(v => `<text x="${sx(v)}" y="${H - pad + 16}" fill="var(--faint)" font-size="10" text-anchor="middle">${v * 100}%</text><text x="${pad - 6}" y="${sy(v) + 3}" fill="var(--faint)" font-size="10" text-anchor="end">${v * 100}%</text>`).join("");
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Predicted win chance against how often the home team won">
    <rect x="${pad}" y="10" width="${W - pad - 10}" height="${H - pad - 10}" fill="none" stroke="var(--line)"/>
    <line x1="${sx(0)}" y1="${sy(0)}" x2="${sx(1)}" y2="${sy(1)}" stroke="var(--faint)" stroke-dasharray="4 4"/>${ticks}${pts}
    <text x="${sx(.5)}" y="${H - 3}" fill="var(--muted)" font-size="11" text-anchor="middle">Predicted home win chance</text></svg>`;
  const folds = R.folds || [];
  view.innerHTML = `<h1>Report card</h1>
    <p class="lede">Each season from ${seasons.length ? seasons[0].season : ""} on was predicted week by week from earlier games and earlier seasons only, the same way the live model works. The benchmark is the closing line in cfbfastR's data, which is the hardest one there is.</p>
    <div class="statline">
      <div><div class="v num">${pct(o.su_model_lined != null ? o.su_model_lined : o.su)}</div><div class="k">Winners picked over the ${o.lined} games with a line. Market: ${pct(o.su_market)}</div></div>
      <div><div class="v num">${f(o.mae_model_lined, 1)}</div><div class="k">Average miss on the margin, in points. Market: ${f(o.mae_market, 1)}</div></div>
      <div><div class="v num">${pct(o.ats)}</div><div class="k">Against the closing line over ${o.ats_n} games. Break-even at standard odds is 52.4%</div></div>
      <div><div class="v num">${f(o.logloss, 3)}</div><div class="k">Log loss on win chances; lower is better${o.logloss_market != null ? `. The line, read the same way: ${f(o.logloss_market, 3)}` : ""}</div></div>
    </div>
    ${cur ? `<h2>${M.season} so far</h2><div class="tbl-scroll"><table><thead>${head}</thead><tbody>${row(String(M.season), cur)}</tbody></table></div>` : ""}
    <h2>By season</h2><div class="tbl-scroll"><table><thead>${head}</thead><tbody>${seasons.map(s => row(s.season, s)).join("")}</tbody></table></div>
    <h2>By point in the season</h2><div class="tbl-scroll"><table><thead>${head}</thead><tbody>${phases.map(s => row(phName[s.phase] || s.phase, s)).join("")}</tbody></table></div>
    <p class="note">Most of the gap to the market comes in weeks 1–4, while ratings still lean on the preseason projection, and in bowls, where opt-outs and coaching changes are things the play-by-play can't see. Each backtest week uses only the rosters known before it.</p>
    <div class="grid2">
      <div><h2>Do the win chances come true?</h2><div class="calib">${svg}</div>
        <p class="note">Games grouped by predicted home win chance. Dots on the dashed line mean things happened as often as predicted. Bigger dots hold more games.</p></div>
      <div><h2>Live settings</h2><div class="tbl-scroll wrap"><table><tbody>
        <tr><td class="l">Home field</td><td class="num">${f(lv.margin && lv.margin.loc, 2)} pts</td></tr>
        ${lv.margin && lv.margin.trav != null ? `<tr><td class="l">Travel: points per doubling of the visitor's trip</td><td class="num">${f(lv.margin.trav * Math.LN2, 2)}</td></tr>` : ""}
        <tr><td class="l">Points per 1-point gap in adjusted success rate: season start, after 10 games</td><td class="num">${lv.margin ? `${f(lv.margin.fS / 100, 2)}, ${f((lv.margin.fS + (lv.margin.fS_x || 0)) / 100, 2)}` : "–"}</td></tr>
        <tr><td class="l">Weight on adjusted points-per-game gap: season start, after 10 games</td><td class="num">${lv.margin ? `${f(lv.margin.fP, 2)}, ${f(lv.margin.fP + (lv.margin.fP_x || 0), 2)}` : "–"}</td></tr>
        ${lv.margin && lv.margin.fR != null ? `<tr><td class="l">Weight on adjusted points-per-drive gap: season start, after 10 games</td><td class="num">${f(lv.margin.fR, 2)}, ${f(lv.margin.fR + (lv.margin.fR_x || 0), 2)}</td></tr>` : ""}
        <tr><td class="l">Preseason prior worth, in games (success rate, points, EPA, pace)</td><td class="num">${lv.k ? `${lv.k.kS}, ${lv.k.kP}, ${lv.k.kE}, ${lv.k.kN}` : "–"}</td></tr>
        <tr><td class="l">Single-game spread: weeks 1–4, later and playoff, other bowls</td><td class="num">${lv.sigma ? `${f(lv.sigma.early)}, ${f(lv.sigma.mid)}, ${f(lv.sigma.post)}` : "–"}</td></tr>
      </tbody></table></div>
      <p class="note">Chosen on every season before ${M.season}. In the backtest each season used settings chosen only on the seasons before it:</p>
      <div class="tbl-scroll"><table><thead><tr><th class="l">Season</th><th>Prior, games</th><th>Home field</th><th>Spread</th></tr></thead><tbody>
      ${folds.map(x => `<tr><td class="l num">${x.season}</td><td class="num">${x.kS}, ${x.kP}, ${x.kE}</td><td class="num">${f(x.b_loc, 2)}</td><td class="num">${f(x.sig_mid)}</td></tr>`).join("")}</tbody></table></div></div>
    </div>
    ${playerReport()}`;
}
function playerReport(){
  const y = PM.yoy || {}, pc = ((DATA.report || {}).prior_coef || {}).Po || {};
  const rn = {qb:"Quarterbacks (per dropback)", rush:"Ball carriers (per carry)", rec:"Receivers (per target)"};
  const perQB = fin(pc.qb) && fin(pc.qbd) ? (pc.qb + pc.qbd) * 0.1 : null;
  return `<h2>Player model</h2>
    <div class="grid2"><div><div class="tbl-scroll"><table><thead><tr><th class="l">Next season from the last two</th><th>Player-seasons</th><th>Correlation</th></tr></thead><tbody>
      ${["qb", "rush", "rec"].filter(r => y[r]).map(r => `<tr><td class="l">${rn[r]}</td><td class="num">${y[r].n.toLocaleString()}</td><td class="num">${f(y[r].r, 2)}</td></tr>`).join("")}</tbody></table></div>
      <p class="note">How well a player's adjusted rate predicts his next season, weighted by plays. All three carry over only modestly. The quarterback still matters most to a team, because he's on every pass.</p></div>
      <div><div class="tbl-scroll wrap"><table><tbody>
        <tr><td class="l">Preseason roster source</td><td class="l">${esc(PM.roster_source || "–")}</td></tr>
        ${perQB != null ? `<tr><td class="l">Preseason points per game for a starter projected 0.10 EPA/dropback better than last year's</td><td class="num">${sgn(perQB, 2)}</td></tr>` : ""}
        <tr><td class="l">Shrinkage (plays at half weight): QB, rusher, receiver</td><td class="num">${PM.lambda ? `${PM.lambda.qb}, ${PM.lambda.rush}, ${PM.k_rec}` : "–"}</td></tr>
      </tbody></table></div>
      <p class="note">In the 2018–2025 backtest, with each week's roster and starter taken only from that team's earlier games (last season's players before its first game), the QB and skill-player terms lower the average miss by about 0.02 points: a small gain, and not in every season. Earlier versions read the roster from the first three games for every week, which overstated it. The live build does better in the preseason when it has a real roster (overrides or CollegeFootballData).</p></div></div>`;
}

// ---------------------------------------------------------- router
function route(){
  const h = location.hash.slice(1) || "rankings";
  const [page, arg, arg2, arg3] = h.split("/");
  const tabFor = {team:"rankings", player:"players", compare:"games", game:"games"}[page] || page;
  document.querySelectorAll(".tab").forEach(b => { const on = b.dataset.tab === tabFor; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); });
  if (page !== "team" && page !== "player" && page !== "compare" && page !== "game") document.documentElement.style.setProperty("--team", "var(--brand-blue-deep)");
  if (page === "team") renderTeam(+arg);
  else if (page === "compare") renderCompare(+arg, +arg2, arg3 === "n");
  else if (page === "game") renderRecap(+arg);
  else if (page === "games"){ if (arg) gmState.week = arg; renderGames(); }
  else if (page === "players") renderPlayers();
  else if (page === "player") renderPlayer(+arg);
  else if (page === "projections") renderProjections();
  else if (page === "conferences") renderConferences();
  else if (page === "report") renderReport();
  else renderRankings();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
})();
</script>
</body>
</html>
